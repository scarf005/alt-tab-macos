name: Build AltTab v10.12.0 patched

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION_FILE: VERSION.txt
      FEEDBACK_TOKEN: ''
      APPCENTER_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euxo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Set app version
        run: |
          set -euxo pipefail
          echo '10.12.0' > VERSION.txt
          scripts/replace_environment_variables_in_app.sh
      - name: Import fixed signing certificate
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CODESIGN_P12"
          echo "$CODESIGN_P12" | base64 --decode > codesign.p12
          scripts/codesign/import_certificate_into_new_keychain.sh codesign "$CODESIGN_P12_PASSWORD"
      - name: Build Debug app
        run: |
          set -euxo pipefail
          set -o pipefail && xcodebuild -workspace alt-tab-macos.xcworkspace -scheme Debug -configuration Debug -derivedDataPath DerivedData SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | scripts/xcbeautify
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' DerivedData/Build/Products/Debug/AltTab.app/Contents/Info.plist
      - name: Package artifact
        run: |
          set -euxo pipefail
          ditto -c -k --keepParent DerivedData/Build/Products/Debug/AltTab.app AltTab-v10.12.0-patched.zip
          shasum -a 256 AltTab-v10.12.0-patched.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AltTab-v10.12.0-patched
          path: AltTab-v10.12.0-patched.zip
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" AltTab-v10.12.0-patched.zip --target "$GITHUB_SHA" --title "$TAG" --notes "v10.12.0 + crash fix + screen recording prompt fix"
